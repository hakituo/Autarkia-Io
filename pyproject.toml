[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Autarkia-Io"
version = "0.1.0"
description = "Atomic file I/O for long-running agents: thread/process-safe temp files, exponential retry for Windows locks, optional fsync, sync + async APIs, and resilient JSON extraction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shihao Qi", email = "qishihao512@gmail.com" },
]
keywords = [
    "atomic-write",
    "file-io",
    "json",
    "windows",
    "retry",
    "durability",
    "autarkia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
async = ["aiofiles>=23.0"]

[project.urls]
Homepage = "https://qishihao.icu/projects/autarkia"
Repository = "https://github.com/hakituo/Autarkia-Io"
Roadmap = "https://github.com/hakituo/Autarkia-tool/blob/main/ROADMAP.md"
"Autarkia Runtime" = "https://github.com/hakituo/Autarkia"
Author = "https://qishihao.icu"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/autarkia_io"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
